<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; font-family: system-ui, sans-serif; padding: 14px; color: #1a1a1a; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 13px; }
  select { width: 100%; padding: 6px; margin-bottom: 12px; font-size: 13px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  button { width: 100%; padding: 8px; background: #2563eb; color: #fff; border: none;
           border-radius: 6px; font-size: 13px; cursor: pointer; margin-top: 6px; }
  button:hover { background: #1d4ed8; }
  .status { font-size: 12px; color: #16a34a; margin-top: 8px; height: 14px; }
  hr { border: none; border-top: 1px solid #eee; margin: 12px 0; }
  .hint { font-size: 11px; color: #666; margin-top: -4px; margin-bottom: 10px; }
  .tabs { display: flex; margin-bottom: 12px; border-bottom: 1px solid #eee; }
  .tab { flex: 1; text-align: center; padding: 8px 0; font-size: 13px; cursor: pointer;
         color: #666; border-bottom: 2px solid transparent; }
  .tab.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 600; }
  .pane { display: none; }
  .pane.active { display: block; }
  #search { width: 100%; padding: 6px; font-size: 12px; margin-bottom: 8px; box-sizing: border-box; }
  #log { max-height: 260px; overflow-y: auto; }
  .entry { border-bottom: 1px solid #f0f0f0; padding: 6px 0; font-size: 12px; }
  .entry .site { font-weight: 600; }
  .entry .meta { color: #666; font-size: 11px; }
  .empty { color: #999; font-size: 12px; text-align: center; padding: 20px 0; }
  .secondary { background: #f3f4f6; color: #1a1a1a; }
  .secondary:hover { background: #e5e7eb; }
</style>
</head>
<body>
  <h1>SetOnce</h1>

  <div class="tabs">
    <div class="tab active" data-pane="settingsPane">Settings</div>
    <div class="tab" data-pane="logPane">History</div>
  </div>

  <div id="settingsPane" class="pane active">

  <label class="row">Mode
    <select id="mode">
      <option value="acceptAll">Accept all</option>
      <option value="rejectAll">Reject all (necessary only)</option>
      <option value="custom">Custom</option>
    </select>
  </label>

  <div id="customBox" style="display:none">
    <label><input type="checkbox" id="necessary" checked disabled> Necessary (always on)</label>
    <label><input type="checkbox" id="functional"> Functional</label>
    <label><input type="checkbox" id="analytics"> Analytics</label>
    <label><input type="checkbox" id="marketing"> Marketing / ads</label>
  </div>

  <hr>
  <label class="row"><input type="checkbox" id="enabled" checked> Turn on auto-handling</label>
  <p class="hint">Off means banners show like normal.</p>

  <button id="save">Save</button>
  <div class="status" id="status"></div>

  </div>

  <div id="logPane" class="pane">
    <input type="text" id="search" placeholder="Search by site...">
    <div id="log"></div>
    <button id="clearLog" class="secondary">Clear history</button>
  </div>

<script src="popup.js"></script>
</body>
</html>
